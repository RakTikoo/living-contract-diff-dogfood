openapi: 3.0.3
info:
  title: Fixture
  version: '1'
paths:
  /users/{id}:
    get:
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - name
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  email:
                    type: string
                    format: email
                  address:
                    type: object
                    required:
                    - city
                    properties:
                      city:
                        type: string
                      zip:
                        type: string
                  tags:
                    type: array
                    items:
                      type: string
